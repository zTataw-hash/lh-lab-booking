<script>
// Shared state only. Calculator iframe and its storage are intentionally untouched.
const cloud = {
  url:'https://ejtefmeobcdxckjmqavx.supabase.co', key:'sb_publishable_D5EQ1uKYNE8YhtlqDMbvBQ_bK4ngnaY',
  bookings:{}, docs:{}, token:'', ready:false, busy:false, dirty:false, section:'home', polling:false
};
function cloudStatus(message){const node=document.getElementById('cloudStatus');if(node)node.textContent=message}
async function cloudRpc(op,args={},token=cloud.token){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch(cloud.url+'/rest/v1/rpc/zyc_api',{method:'POST',headers:{apikey:cloud.key,'Content-Type':'application/json'},body:JSON.stringify({op,args,token}),signal:controller.signal});
    const data=await response.json();
    if(!response.ok)throw Error(data.code==='PGRST202'?'数据库尚未初始化，请先执行 supabase-init.sql':data.message||'云端请求失败');
    if(!data.ok){if(data.auth){cloud.token='';exitAdmin()}throw Error(data.error||'保存失败')}
    return data;
  }catch(e){if(e.name==='AbortError')throw Error('连接超时，请检查网络后重试');throw e}finally{clearTimeout(timer)}
}
function cloudDoc(key,fallback){return structuredClone(cloud.docs[key]?.data??fallback)}
async function cloudSaveDoc(key,data){
  const revision=cloud.docs[key]?.revision;
  if(revision===undefined)throw Error('请重新进入此模块，载入云端数据');
  const result=await cloudRpc('doc_save',{key,data,revision});
  cloud.docs[key]={data:structuredClone(data),revision:result.revision};cloud.dirty=false;
}
async function cloudRefresh(admin=false){
  const [result,privateData]=await Promise.all([cloudRpc('read',{},''),admin?cloudRpc('admin_read'):Promise.resolve(null)]);cloud.bookings=result.bookings;
  if(Array.isArray(result.instruments)){
    INST.splice(0,INST.length,...result.instruments);
    const visible=INST.filter(item=>item.status!=='archived');
    if(!visible.some(item=>item.id===inst)){inst=visible[0]?.id||'';selected.clear();}
  }
  // Do not advance editable document revisions underneath unsaved forms.
  if(!cloud.token)cloud.docs.info=result.docs.info;
  if(privateData){cloud.docs=privateData.docs;cloud.bookingCodes=privateData.bookingCodes||{}}
  cloud.ready=true;cloudStatus('已连接云端 · 数据每 5 秒同步');
}
async function cloudOperation(fn){
  if(cloud.busy)return false;
  cloud.busy=true;document.body.classList.add('cloud-saving');
  try{await fn();return true}catch(e){cloudStatus(e.message);show(e.message);return false}
  finally{cloud.busy=false;document.body.classList.remove('cloud-saving')}
}

function shortBookingRuns(ids){

  sorted.forEach(x=>{const last=runs[runs.length-1];if(last&&last[last.length-1].instrument===x.instrument&&last[last.length-1].t+3600000===x.t)last.push(x);else runs.push([x])});

function confirmShortBooking(runs){
  return new Promise(resolve=>{
    const mask=document.createElement('div');mask.className='consumable-mask';mask.style.display='flex';mask.setAttribute('role','dialog');mask.setAttribute('aria-modal','true');mask.setAttribute('aria-label','确认短时预约');

    mask.onkeydown=e=>{if(e.key==='Escape')finish(false);if(e.key==='Tab'){const buttons=[...mask.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);e.preventDefault();buttons[(i+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus()}};

function installAdminSwipe(grid){
  let gesture=null;
  const target=(x,y)=>document.elementFromPoint(x,y)?.closest('.admin-slot-choice');
  const paint=label=>{if(!label||!grid.contains(label)||gesture.seen.has(label))return;gesture.seen.add(label);const input=label.querySelector('input');input.checked=gesture.want;label.classList.toggle('chosen',input.checked);input.dispatchEvent(new Event('change'))};
  grid.addEventListener('change',e=>e.target.closest('.admin-slot-choice')?.classList.toggle('chosen',e.target.checked));
  grid.addEventListener('pointerdown',e=>{const label=e.target.closest('.admin-slot-choice');if(!label)return;gesture={x:e.clientX,y:e.clientY,label,want:!label.querySelector('input').checked,seen:new Set(),active:e.pointerType==='mouse',mouse:e.pointerType==='mouse'};if(gesture.mouse){e.preventDefault();grid.setPointerCapture(e.pointerId);paint(label)}});
  grid.addEventListener('pointermove',e=>{if(gesture?.mouse)paint(target(e.clientX,e.clientY))});
  grid.addEventListener('pointerup',()=>{if(gesture?.mouse)gesture=null});
  grid.addEventListener('pointercancel',()=>{if(gesture?.mouse)gesture=null});
  grid.addEventListener('touchmove',e=>{if(!gesture||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-gesture.x,dy=t.clientY-gesture.y;if(!gesture.active){if(Math.max(Math.abs(dx),Math.abs(dy))<8)return;if(Math.abs(dy)>=Math.abs(dx)){gesture=null;return}gesture.active=true;paint(gesture.label)}e.preventDefault();paint(target(t.clientX,t.clientY))},{passive:false});
  grid.addEventListener('touchend',e=>{if(gesture){e.preventDefault();if(!gesture.active)paint(gesture.label);gesture=null}},{passive:false});
  grid.addEventListener('touchcancel',()=>gesture=null);
  grid.addEventListener('click',e=>{if(e.detail)e.preventDefault()});
}

function labToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>Number(parts.find(p=>p.type===t).value);return new Date(get('year'),get('month')-1,get('day'))}
function monday(d){return add(start(d),-((d.getDay()+6)%7))}
function isPastDay(d){return key(d)<key(labToday())}
function isExpiredSlot(d,h,now=Date.now()){return Date.parse(key(d)+'T00:00:00+08:00')+(Number(h)+1)*3600000<=now}
function isExpiredSlotId(id){const slot=parseSlotId(id);return isExpiredSlot(slot.date,slot.hour)}

function start(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return start(x)}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function wd(d){return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
function cn(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function bid(i,d,h){return `${i}|${key(d)}|${h}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  return {instrument:i,date:new Date(y,m-1,d),hour:Number(hs)};
}

function dateTimeline(d){
  const bookings=load(),runs=[];
  for(let h=0;h<24;h++){
    const bk=bookings[bid(inst,d,h)],state=isExpiredSlot(d,h)?'expired':bk?'occupied':instrumentCanBook(inst)?'free':'paused',name=bk?.booker||'';
    const last=runs[runs.length-1];
    if(last&&last.state===state&&last.name===name)last.end=h+1;else runs.push({start:h,end:h+1,state,name});
  }
  return '<div class="date-timeline">'+runs.map(r=>`<span class="timeline-${r.state}" style="flex:${r.end-r.start}" title="${pad(r.start)}:00–${pad(r.end)}:00 ${esc(r.name||({expired:'已过期',free:'可预约',occupied:'已占用',paused:'暂停预约'}[r.state]))}"><span>${esc(r.name)}</span></span>`).join('')+'</div><div class="timeline-hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';

    show('这些时段来自不同次预约，请分开取消，并输入各次预约时设置的码');
    return;
  }
  const want = force===undefined ? !selected.has(id) : force;
  if(want) selected.set(id,parseSlotId(id));
  else selected.delete(id);
}
function rerenderVisibleSlots(){
  renderSlots('slots',day);
  renderSlots('mslots',day);
  updateSelectionBar();
}

function beginDragSelection(el,e,immediate){
  const id=el.dataset.slotId;
  if(!id || !isEligible(id)) return;
  drag.pointerId=e.pointerId;
  drag.startX=e.clientX;drag.startY=e.clientY;
  drag.moved=false;drag.lastId=null;
  drag.touchLike=e.pointerType==='touch'||e.pointerType==='pen';
  drag.intent=selected.has(id)?'remove':'add';

  const activate=()=>{
    drag.active=true;
    document.body.classList.add('dragging');
    applyDragAt(el);
  };
  if(immediate) activate();
  else drag.timer=setTimeout(activate,190);
}


function fillRowByHour(hour, force){
  const row=Math.floor(hour/3);
  for(let h=row*3;h<row*3+3 && h<24;h++){
    const id=bid(inst,day,h);
    if(isEligible(id)) toggleSlotId(id,force);
  }
}

function applyDragAt(el){
  if(!el || !el.dataset || !el.dataset.slotId) return;
  const id=el.dataset.slotId;
  if(id===drag.lastId || !isEligible(id)) return;
  if(!drag.lastId)selectSlotAction(id);
  if((load()[id]?'cancel':'book')!==action)return;

  // 从一排最右侧滑到下一排时，自动选中下一整排，类似手机照片选择
  if(drag.lastId){
    const prev=parseSlotId(drag.lastId);
    const cur=parseSlotId(id);
    if(prev.date.getTime()===cur.date.getTime() && prev.hour%3===2 && cur.hour===prev.hour+3){
      fillRowByHour(cur.hour, drag.intent==='add');
      drag.lastId=id;
      rerenderVisibleSlots();
      return;
    }
  }

  drag.lastId=id;
  toggleSlotId(id,drag.intent==='add');
  rerenderVisibleSlots();
}

function attachSlotPointer(el){
  el.addEventListener('touchmove',handleSlotTouchMove,{passive:false});
  el.addEventListener('touchend',finishSlotTouch);
  el.addEventListener('touchcancel',finishSlotTouch);
  el.addEventListener('pointerdown',e=>{
    const id=el.dataset.slotId;
    if(!id || !isEligible(id)) return;

    if(e.pointerType==='mouse'){
      e.preventDefault();
      beginDragSelection(el,e,true);
    }else{
      // Delay selection until horizontal intent is established; vertical swipes scroll.
      drag.pointerId=e.pointerId;drag.startX=e.clientX;drag.startY=e.clientY;
      drag.active=false;drag.moved=false;drag.lastId=null;drag.touchLike=true;
      drag.startSlot=el;drag.intent=selected.has(id)?'remove':'add';
    }
  });
}

// A non-passive touch listener reserves scrolling only after a horizontal swipe.
function handleSlotTouchMove(e){
  if(!drag.touchLike||drag.pointerId===null||e.touches.length!==1)return;
  const touch=e.touches[0];
  const dx=touch.clientX-drag.startX,dy=touch.clientY-drag.startY;
  if(!drag.active){
    if(Math.max(Math.abs(dx),Math.abs(dy))<8)return;
    drag.moved=true;
    if(Math.abs(dy)>=Math.abs(dx)){
      drag.pointerId=null;drag.startSlot=null;return;
    }
    if(!e.cancelable){drag.pointerId=null;return}
    e.preventDefault();
    drag.active=true;document.body.classList.add('dragging');
    applyDragAt(drag.startSlot);
  }
  if(e.cancelable)e.preventDefault();
  const hit=document.elementFromPoint(touch.clientX,touch.clientY);
  const slot=hit&&hit.closest?hit.closest('.slot[data-slot-id]'):null;
  if(slot)applyDragAt(slot);
}
function finishSlotTouch(e){if(drag.active){drag.active=false;drag.pointerId=null;drag.lastId=null;document.body.classList.remove('dragging')}}
document.addEventListener('pointermove',e=>{
  if(drag.pointerId!==e.pointerId) return;
  const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
  if(Math.hypot(dx,dy)>7) drag.moved=true;

  if(!drag.active){
    if(drag.touchLike && drag.moved && drag.timer){
      clearTimeout(drag.timer);drag.timer=null;
    }
    return;
  }
  e.preventDefault();
  const hit=document.elementFromPoint(e.clientX,e.clientY);
  const slot=hit && hit.closest ? hit.closest('.slot[data-slot-id]') : null;
  if(slot) applyDragAt(slot);
},{passive:false});

function finishPointer(e){
  if(drag.pointerId!==e.pointerId) return;
  if(drag.timer){clearTimeout(drag.timer);drag.timer=null}
  const wasActive=drag.active;
  const moved=drag.moved;
  const x=e.clientX,y=e.clientY;
  drag.active=false;drag.pointerId=null;drag.lastId=null;
  document.body.classList.remove('dragging');

  if(e.type!=='pointercancel' && !wasActive && !moved){
    const hit=document.elementFromPoint(x,y);
    const slot=hit && hit.closest ? hit.closest('.slot[data-slot-id]') : null;
    if(slot && isEligible(slot.dataset.slotId)){
      toggleSlotId(slot.dataset.slotId);
      rerenderVisibleSlots();
    }
  }
}
document.addEventListener('pointerup',finishPointer);
document.addEventListener('pointercancel',finishPointer);

function formatSlotRange(arr){
  if(!arr.length)return "";
  arr=arr.slice();
  arr.sort((a,b)=>a.date-b.date||a.hour-b.hour);
  let res=[];
  let s=arr[0],e=arr[0];
  for(let i=1;i<arr.length;i++){
    let c=arr[i];
    if(c.date.toDateString()==e.date.toDateString() && c.hour==e.hour+1){
      e=c;
    }else{
      res.push(`${cn(s.date)} ${pad(s.hour)}:00-${pad(e.hour+1)}:00`);
      s=e=c;
    }
  }
  res.push(`${cn(s.date)} ${pad(s.hour)}:00-${pad(e.hour+1)}:00`);
  return res.join('；');
}

      状态：${r.done?'<span class="loss-done">已补充</span>':'<span class="loss-wait">待补充</span>'}<br>
      <button onclick="adminToggleLoss('${r.id}')">
        ${r.done?"恢复待补充":"标记已补充"}

window.addEventListener("load",()=>{
  const btn=document.getElementById("adminLoss");
  if(btn){
    btn.onclick=openAdminLossPanel;
  }
});

async function adminToggleLoss(id){
  const arr=loadLoss();
  const r=arr.find(x=>String(x.id)===String(id));
  if(!r){
    show("记录不存在");
    return;
  }
  r.done=!r.done;
  r.replenishedDate=r.done?new Date().toISOString().slice(0,10):"";
  if(!await saveLoss(arr))return;
  openAdminLossPanel();
  show(r.done?"已标记补充":"已恢复待补充");
}

async function adminDeleteLoss(id){
  let arr=loadLoss();
  const before=arr.length;
  arr=arr.filter(x=>String(x.id)!==String(id));
  if(!await saveLoss(arr))return;
  openAdminLossPanel();
  show(arr.length<before?"已删除":"记录不存在");
}

const SALARY_KEY="zyc_salary_records";

function loadSalary(){return []}

function saveSalary(a){
  localStorage.setItem(SALARY_KEY,JSON.stringify(a));
}

function openSalary(){
  if(!adminMode){
    show("请先进入管理员模式");
    return;
  }
  const list=document.getElementById("adminList");
  const arr=loadSalary();

  if(arr.length===0){
    list.innerHTML=`
    <b>劳务管理</b><br><br>
    暂无劳务记录<br>
    <button onclick="addSalaryDemo()">新增申报记录</button>`;
    return;
  }

  list.innerHTML=`
  <b>劳务管理</b>
  ${arr.map((r,i)=>`
  <div class="record-item">
    <b>${r.name}</b><br>
    本月申报：${r.monthAmount} 元<br>
    累计已发：${r.paid} 元<br>
    剩余：${r.remain} 元
  </div>`).join("")}
  <button onclick="addSalaryDemo()">新增申报记录</button>`;
}

function addSalaryDemo(){
  const name=prompt("姓名");
  if(!name)return;
  const month=prompt("本月申报金额");
  const paid=prompt("已发劳务总额");
  const arr=loadSalary();
  arr.push({
    name:name,
    monthAmount:Number(month)||0,
    paid:Number(paid)||0,
    remain:(Number(paid)||0)-(Number(month)||0)
  });
  saveSalary(arr);
  openSalary();
}

function formatBookingCreatedAt(value){
  if(value===undefined||value===null||value==='')return '未记录';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '未记录';
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

  if(!adminMode)return;

function renderCenterHome(){
  const rows=[['instruments','仪器管理','添加仪器、暂停预约和移除仪器'],['bookings','预约记录','查看所有仪器预约，按记录取消预约'],['loss','耗材管理',`${loadLoss().filter(r=>!r.done).length} 条待补充 · 损失登记、补充状态与导出`],['salary','劳务管理',`${salaryPeople().length} 位人员 · ${salaryClaims().length} 份月度申报`],['funds','实验资金','记录收入与支出，查看资金余额']];

function showAdminList(){
  const bookings=load(),groups=new Map();
  Object.entries(bookings).forEach(([id,b])=>{const instrument=id.split('|')[0];const group=instrument+'|'+(b.groupId||b.booker+'_'+b.createdAt);if(!groups.has(group))groups.set(group,{...b,instrument,ids:[]});groups.get(group).ids.push(id)});
  $('adminList').innerHTML='<p>全部仪器 · '+groups.size+' 条预约</p>';
  if(!groups.size)$('adminList').innerHTML+='<div class="center-empty">暂无预约记录，前台预约后会显示在这里。</div>';
  [...groups.values()].sort((a,b)=>(new Date(b.createdAt).getTime()||0)-(new Date(a.createdAt).getTime()||0)).forEach(g=>{const row=document.createElement('div');row.className='record-item'+(g.ids.every(isExpiredSlotId)?' expired-record':'');row.innerHTML=`<b>${esc(g.booker)} · ${esc(INST.find(i=>i.id===g.instrument)?.name||g.instrument)}</b><br>发起预约时间：${formatBookingCreatedAt(g.createdAt)}<br>预约码：${esc(cloud.bookingCodes?.[g.groupId]??'旧预约码未保存')}<br>预约使用时段：${formatSlotRange(g.ids.map(parseSlotId))}${g.purpose?'<br>用途：'+esc(g.purpose):''}<br>`;const button=document.createElement('button');button.textContent='取消此预约';if(g.ids.every(id=>isExpiredSlotId(id)))button.textContent='删除过期预约';button.onclick=()=>cloudAdminCancel(g);row.append(button);$('adminList').append(row)});
}

function loadFunds(){return cloudDoc('funds',[])}
function renderFunds(){
  const records=loadFunds(),income=records.filter(r=>r.type==='income').reduce((n,r)=>n+r.cents,0),expense=records.filter(r=>r.type==='expense').reduce((n,r)=>n+r.cents,0);
  $('adminList').innerHTML=`<div>当前余额</div><div class="fund-balance">¥ ${((income-expense)/100).toFixed(2)}</div><p>累计收入 ¥ ${(income/100).toFixed(2)} / 累计支出 ¥ ${(expense/100).toFixed(2)}</p><form id="fundForm" class="center-form"><label>收支类型<select name="type"><option value="income">收入</option><option value="expense">支出</option></select></label><label>日期<input name="date" type="date" value="${todayStr()}" required></label><label>金额（元）<input name="amount" type="number" min="0.01" max="999999999" step="0.01" required></label><label>事项说明<input name="memo" maxlength="120" placeholder="例如：实验耗材采购" required></label><button class="primary" type="submit">保存收支记录</button></form><div id="fundRecords"></div>`;
  $('fundRecords').innerHTML=records.slice().reverse().map(r=>`<div class="record-item"><b>${esc(r.memo)}</b><br>${esc(r.date)} · ${r.type==='income'?'收入 +':'支出 −'} ¥ ${(r.cents/100).toFixed(2)}</div>`).join('')||'<p class="center-empty">暂无收支记录，可先录入一笔期初资金。</p>';
  $('fundForm').onsubmit=async e=>{e.preventDefault();if(!adminMode)return;const data=new FormData(e.target),cents=Math.round(Number(data.get('amount'))*100),memo=data.get('memo').trim();if(!Number.isSafeInteger(cents)||cents<=0||!memo)return;const latest=loadFunds();latest.push({type:data.get('type'),date:data.get('date'),cents,memo});if(!await cloudSaveHandled('funds',latest))return;renderFunds();show('收支记录已保存')};
}

const SALARY_PEOPLE_KEY='zyc_salary_people_v1',SALARY_CLAIMS_KEY='zyc_salary_claims_v1';
function readSalaryArray(key){try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function salaryRecordId(){
  if(typeof globalThis.crypto?.randomUUID==='function')return globalThis.crypto.randomUUID();
  const bytes=new Uint8Array(16);globalThis.crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}
function salaryMoney(value){return Math.round((Number(value)||0)*100)}
function salaryDisplay(cents){return (cents/100).toFixed(2)}
function salaryPeople(){return salaryState().people}
function salaryClaims(){return salaryState().claims}
async function persistSalary(key,value){return cloudSaveHandled('salary',value)}
const SALARY_STATE_KEY='zyc_salary_state_v2';
function salaryState(){return cloudDoc('salary',{people:[],claims:[],logs:[]})}
function salaryChange(before,after){return {personId:after.id,name:after.name,before:before?{...before}:null,after:{...after}}}
function recordSalaryChange(state,kind,changes,month){
  if(changes.length)state.logs.push({id:salaryRecordId(),at:new Date().toISOString(),kind,month:month||'',changes});
}
function renderSalaryLogs(){
  const target=$('salaryChangeHistory');if(!target)return;
  target.innerHTML=salaryState().logs.slice().reverse().map(log=>`<details><summary>${esc(formatBookingCreatedAt(log.at))} · ${esc(log.kind)} ${esc(log.month)}</summary>${log.changes.map(c=>`<div class="record-item"><b>${esc(c.name)}</b>${c.before&&c.before.name!==c.after.name?`（原姓名：${esc(c.before.name)}）`:''}<br>理论发放：${c.before?salaryDisplay(c.before.theory):'0.00'} → ${salaryDisplay(c.after.theory)} 元<br>已发放：${c.before?salaryDisplay(c.before.paid):'0.00'} → ${salaryDisplay(c.after.paid)} 元<br>剩余：${salaryDisplay(c.after.theory-c.after.paid)} 元</div>`).join('')}</details>`).join('')||'<p class="salary-note">暂无修改记录。后续保存的人员调整和申报发放会记录在这里。</p>';
}
function openSalary(){
  if(!adminMode)return;
  const people=salaryPeople();
  $('adminList').innerHTML=`<p class="salary-note">先添加人员，再设置发放金额。剩余金额 = 理论发放金额 − 已发放金额。金额单位：元。</p><form id="salaryPeopleForm"><div class="salary-table-wrap"><table class="salary-table"><thead><tr><th>姓名（必填）</th><th>理论发放金额</th><th>已发放金额</th><th>剩余金额</th></tr></thead><tbody id="salaryPeopleRows"></tbody></table></div><p id="salaryEmpty" class="salary-note" ${people.length?'hidden':''}>暂无人员，点击“添加人员”新增一行。</p><div class="salary-tools"><button type="button" id="salaryAddPerson">添加人员</button><button class="primary" type="submit">保存人员及金额</button><button type="button" id="salaryNewClaim">新增申报记录</button></div><div id="salarySaveStatus" role="status" class="salary-note"></div></form><div class="salary-history"><h3>月度申报记录</h3><div id="salaryClaimHistory"></div></div><div class="salary-history"><h3>修改记录</h3><div id="salaryChangeHistory"></div></div><div id="salaryLegacy"></div>`;
  people.forEach(appendSalaryPerson);
  $('salaryAddPerson').onclick=()=>{appendSalaryPerson({id:salaryRecordId(),name:'',theory:0,paid:0});cloud.dirty=true;$('salaryEmpty').hidden=true;$('salarySaveStatus').textContent='有未保存的修改，请点击保存。';$('salaryPeopleRows').lastElementChild.querySelector('input').focus()};
  $('salaryPeopleForm').onsubmit=async e=>{e.preventDefault();await saveSalaryPeopleForm()};
  $('salaryNewClaim').onclick=async()=>{if(await saveSalaryPeopleForm())openSalaryClaim()};

async function deleteSalaryClaim(id){
  if(!adminMode)return;
  if($('salarySaveStatus').textContent.includes('未保存')){show('请先保存人员及金额的修改，再删除申报');return}
  let state=salaryState(),claim=state.claims.find(c=>c.id===id);
  if(!claim){show('该申报记录已不存在');return}
  if(!confirm(`确认删除 ${claim.month} 的申报记录？${claim.appliedToPaid?'将从对应人员的已发放金额中扣回本次申报金额。':'这是一条旧版记录，不会调整已发放金额。'}删除后可重新申报该月份。`))return;
  state=salaryState();claim=state.claims.find(c=>c.id===id);
  if(!claim)return;
  const deductions=new Map();
  if(claim.appliedToPaid)claim.entries.forEach(e=>deductions.set(e.personId,(deductions.get(e.personId)||0)+e.amount));
  for(const [personId,amount] of deductions){
    const person=state.people.find(p=>p.id===personId);
    if(!person||person.paid<amount){show('无法扣回：人员不存在或已发放金额不足，请先核对人员金额');return}
  }
  const changes=[];
  for(const [personId,amount] of deductions){const person=state.people.find(p=>p.id===personId),before={...person};person.paid-=amount;changes.push(salaryChange(before,person))}
  state.claims=state.claims.filter(c=>c.id!==id);
  state.logs.push({id:salaryRecordId(),at:new Date().toISOString(),kind:claim.appliedToPaid?'删除申报并扣回已发放':'删除旧版申报（未调整金额）',month:claim.month,changes,deletedClaim:claim});
  if(!await persistSalary(SALARY_STATE_KEY,state))return;
  openSalary();show('申报记录已删除，可重新申报该月份');
}

function cleanRichHtml(html){
  const source=document.createElement('template');source.innerHTML=String(html||'');
  const allowed=new Set(['P','DIV','BR','SPAN','B','STRONG','I','EM','U','UL','OL','LI','FONT']);
  const clean=node=>{
    if(node.nodeType===3)return document.createTextNode(node.textContent);
    if(node.nodeType!==1)return document.createTextNode('');
    if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH'].includes(node.tagName))return document.createTextNode('');
    const out=document.createElement(allowed.has(node.tagName)?(node.tagName==='FONT'?'span':node.tagName.toLowerCase()):'span');
    const style=node.style;
    if(style){if(/^(1[0-9]|[2-3][0-9]|4[0-8])px$/.test(style.fontSize))out.style.fontSize=style.fontSize;if(style.color)out.style.color=style.color;if(['bold','700','800'].includes(style.fontWeight))out.style.fontWeight='700';if(style.fontStyle==='italic')out.style.fontStyle='italic';if(style.textDecoration.includes('underline'))out.style.textDecoration='underline'}
    if(node.tagName==='FONT'&&node.getAttribute('color'))out.style.color=node.getAttribute('color');
    node.childNodes.forEach(child=>out.append(clean(child)));return out;
  };
  const result=document.createElement('div');source.content.childNodes.forEach(node=>result.append(clean(node)));return result.innerHTML;
}

e;tab.focus();tab.print()}};setTimeout(()=>{if(tab.document.readyState==='complete'&&!tab.__printed){tab.__printed=true;tab.focus();tab.print()}},400)};
  refreshNames();$('exportClose').focus();

// Minimal OOXML workbook in a store-only ZIP; no external scripts or network requests.
function workbookBytes(m){
  const xml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  const col=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
  const sheet=rows=>`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="2" width="22" customWidth="1"/><col min="3" max="26" width="12" customWidth="1"/></cols><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>{const x=v&&typeof v==='object'?v:{v},ref=col(j)+(i+1),style=i===0?1:(x.s||0);return typeof x.v==='number'?`<c r="${ref}" s="${style}"><v>${x.v}</v></c>`:`<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xml(x.v??'')}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const timeline=[['日期','仪器',...Array.from({length:24},(_,h)=>`${h}:00–${h+1}:00`)]],details=[['日期','仪器','开始','结束','预约人','备注','是否高亮']];
  m.rows.forEach((r,i)=>{timeline.push([i===0||m.rows[i-1].date!==r.date?r.date:'',r.instrument,...r.cells.map(c=>({v:c.name,s:c.name?(c.match?5+m.names.indexOf(c.name):3):c.expired?4:0}))]);r.cells.filter(c=>c.name).forEach(c=>details.push([r.date,r.instrument,c.hour+':00',(c.hour+1)+':00',c.name,c.purpose,c.match?'是':'否']))});
  const stats=[['指标','数值'],['开始日期',m.startDate],['结束日期',m.endDate],['统计人员',m.people.join('、')||'全部预约人'],['实验天数',m.usedDays],['预约小时数',m.hours],['范围内总仪器小时',m.capacity],['时段占用比例',(m.ratio*100).toFixed(2)+'%'],['全部已预约小时',m.totalBooked],['占已预约时长',(m.bookedRatio*100).toFixed(2)+'%'],...m.names.map(name=>['高亮颜色：'+name,'#'+m.colors[name]]),['统计口径','按现存预约；天数按日期去重；比例为预约小时 / 范围内总仪器小时']];
  const files={'[Content_Types].xml':`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${[1,2,3].map(n=>`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`,
  '_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
  'xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="预约视图" sheetId="1" r:id="rId1"/><sheet name="预约明细" sheetId="2" r:id="rId2"/><sheet name="统计" sheetId="3" r:id="rId3"/></sheets></workbook>',
  'xl/_rels/workbook.xml.rels':`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${[1,2,3].map(n=>`<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/>`).join('')}<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
  'xl/styles.xml':`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="${6+m.names.length}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${['E8F0E9','EBA5A1','EEEAE7','E4E8E3',...m.names.map(n=>m.colors[n])].map(c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${5+m.names.length}">${[0,2,3,4,5,...m.names.map((_,i)=>6+i)].map((f,i)=>`<xf numFmtId="0" fontId="${i===1?1:0}" fillId="${f}" borderId="0" xfId="0" applyFill="1"/>`).join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
  'xl/worksheets/sheet1.xml':sheet(timeline),'xl/worksheets/sheet2.xml':sheet(details),'xl/worksheets/sheet3.xml':sheet(stats)};
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;const pack=(size,entries)=>{const b=new Uint8Array(size),v=new DataView(b.buffer);entries.forEach(([p,n,bytes])=>bytes===2?v.setUint16(p,n,true):v.setUint32(p,n,true));return b};
  for(const [name,text] of Object.entries(files)){const n=enc.encode(name),data=enc.encode(text);let crc=0xffffffff;for(const byte of data){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=(crc^0xffffffff)>>>0;const h=pack(30,[[0,0x04034b50,4],[4,20,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,n.length,2]]);parts.push(h,n,data);central.push(pack(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,n.length,2],[42,offset,4]]),n);offset+=h.length+n.length+data.length}
  const csize=central.reduce((n,p)=>n+p.length,0);parts.push(...central,pack(22,[[0,0x06054b50,4],[8,Object.keys(files).length,2],[10,Object.keys(files).length,2],[12,csize,4],[16,offset,4]]));const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let pos=0;parts.forEach(p=>{out.set(p,pos);pos+=p.length});return out;
}
function downloadBookingWorkbook(m){const url=URL.createObjectURL(new Blob([workbookBytes(m)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),link=document.createElement('a');link.href=url;link.download=`LH预约_${m.startDate}_${m.endDate}.xlsx`;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function installPageMotion(){
  const reduced=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('click',e=>{
    const id=e.target.closest('#infoClose')?'infoMask':e.target.closest('#lossClose')?'lossMask':['infoMask','lossMask'].includes(e.target.id)?e.target.id:null;
    if(!id||reduced())return;const mask=$(id),box=mask.firstElementChild;if(!box.animate)return;
    e.preventDefault();e.stopImmediatePropagation();if(mask.dataset.closing)return;mask.dataset.closing='1';
    const animation=box.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(8px)'}],{duration:150,easing:'ease-in'});
    animation.finished.then(()=>{mask.style.display='none';delete mask.dataset.closing}).catch(()=>{delete mask.dataset.closing});
  },true);
  document.addEventListener('click',e=>{const icon=e.target.closest('.top-tools .tool-btn')?.querySelector('svg');if(icon?.animate&&!reduced())icon.animate([{transform:'scale(1)'},{transform:'scale(.88) rotate(-5deg)'},{transform:'scale(1)'}],{duration:240})});
  ['infoMask','lossMask','mask'].forEach(id=>{const el=$(id);let visible=el.style.display==='flex';new MutationObserver(()=>{const next=el.style.display==='flex';if(next&&!visible&&!reduced())el.firstElementChild.animate?.([{opacity:0,transform:'translateY(14px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});visible=next}).observe(el,{attributes:true,attributeFilter:['style']})});
  let formula=document.body.classList.contains('formula-open');new MutationObserver(()=>{const next=document.body.classList.contains('formula-open');if(next!==formula&&!reduced()){const target=next?$('formulaCenter'):document.querySelector('main.main');target?.animate?.([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'ease-out'})}formula=next}).observe(document.body,{attributes:true,attributeFilter:['class']});
}
const exportStyle=document.createElement('style');exportStyle.textContent=exportViewCss;document.head.append(exportStyle);
installPageMotion();

<script>
// Consumable inventory. Calculator reagent inventory is independent.
function stockState(){return cloudDoc('stock',{items:[],logs:[]})}
function stockUuid(){return typeof salaryRecordId==='function'?salaryRecordId():(crypto.randomUUID?.()||'stock_'+Date.now()+'_'+Math.random().toString(36).slice(2))}
async function renderStockChoices(){
 const select=$('lossStockChoice'),old=select.value;
 select.disabled=true;$('lossStockHint').textContent='正在载入物品选项…';
 try{
  const r=await cloudRpc('stock_read',{},'');
  select.innerHTML='<option value="">请选择物品</option>';
  r.items.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name+(x.spec?' · '+x.spec:'')+'（'+x.unit+'）';o.dataset.note=x.note||'';select.append(o)});
  select.append(new Option('其他（其他药品、常规耗材、仪器维修等）','other'));
  select.value=[...select.options].some(o=>o.value===old)?old:'';
  $('lossStockHint').textContent='';
 }catch(e){select.innerHTML='<option value="other">其他（其他药品、常规耗材、仪器维修等）</option>';show(e.message)}
 finally{select.disabled=false;updateStockChoice()}
}
function updateStockChoice(){
 const s=$('lossStockChoice'),other=s.value==='other';
 $('lossOtherField').hidden=!other;
 $('lossStockHint').textContent=s.selectedOptions[0]?.dataset.note||'';
 if(!other)$('lossItem').value='';
}
async function submitStockLoss(){
 const s=$('lossStockChoice');if(!s.value){show('请选择物品或其他');return}
 const args={item:s.value==='other'?$('lossItem').value.trim():s.selectedOptions[0].textContent,
  stockId:s.value==='other'?'':s.value,person:$('lossPerson').value.trim(),num:$('lossNum').value.trim()||'1',date:$('lossDate').value||todayStr(),remark:$('lossRemark').value.trim()};
 if(!args.item||!args.person){show('请填写物品和填写人');return}
 await cloudOperation(async()=>{await cloudRpc('loss_add',args,'');$('lossMask').style.display='none';$('lossItem').value='';$('lossRemark').value='';$('lossNum').value='';s.value='';show(args.stockId?'登记已提交，库存已扣减':'登记已提交');});
}
function renderStock(){
 const state=stockState();
 $('adminList').innerHTML=`<div class="stock-intro"><p>登记可选物品提交后自动扣减，处理完成后补回。每项均可填写备注。</p><button class="primary" id="stockAdd">＋ 添加物品</button></div>`+
 ['selectable','private'].map(section=>`<section class="stock-section"><h3>${section==='selectable'?'登记可选物品':'仅管理员查看'}</h3><div class="stock-grid">${state.items.filter(x=>x.section===section).map(x=>{
 const missing=Math.max(0,x.target-x.current);return `<article class="stock-card${missing?' stock-low':''}"><header><b>${esc(x.name)}</b><span>${esc(x.spec||'')}</span></header><div class="stock-count">${esc(x.current)} <small>${esc(x.unit)}</small></div><p>应保持 ${esc(x.target)} ${esc(x.unit)} · ${missing?'待补 '+missing+' '+esc(x.unit):'数量充足'}</p><p class="stock-note">备注：${esc(x.note||'未填写')}</p>${section==='selectable'&&!x.enabled?'<small>已关闭登记选项</small>':''}<footer><button data-stock-edit="${esc(x.id)}">编辑</button><button data-stock-adjust="${esc(x.id)}">入库 / 调整</button><button data-stock-delete="${esc(x.id)}">删除</button></footer></article>`}).join('')||'<p class="center-empty">暂无物品，点击“添加物品”开始记录。</p>'}</div></section>`).join('')+
 `<details class="stock-section"><summary>库存操作记录（最近 500 条）</summary>${state.logs.slice(0,500).map(x=>`<div class="record-item"><b>${esc(x.name)} · ${esc(x.action)}</b> ${Number(x.delta)>0?'+':''}${esc(x.delta)} · 库存 ${esc(x.balance)}<br><small>${esc(formatBookingCreatedAt(x.at))}${x.note?' · '+esc(x.note):''}</small></div>`).join('')||'<p>暂无操作记录</p>'}</details>`;
 $('stockAdd').onclick=()=>openStockEditor();
 $('adminList').querySelectorAll('[data-stock-edit]').forEach(b=>b.onclick=()=>openStockEditor(b.dataset.stockEdit));
 $('adminList').querySelectorAll('[data-stock-adjust]').forEach(b=>b.onclick=()=>openStockEditor(b.dataset.stockAdjust,true));
 $('adminList').querySelectorAll('[data-stock-delete]').forEach(b=>b.onclick=async()=>{
  const state=stockState(),item=state.items.find(x=>x.id===b.dataset.stockDelete);if(!item||!confirm('确定删除“'+item.name+'”？已有联动登记的物品不能删除，可关闭登记或移入仅管理员查看。'))return;
  await saveStockItems(state.items.filter(x=>x.id!==item.id),'删除物品');
 });
}
async function saveStockItems(items,reason,revision=cloud.docs.stock?.revision){
 return cloudOperation(async()=>{await cloudRpc('stock_save',{items,reason,revision});await cloudRefresh(true);cloud.dirty=false;renderStock();show('库存已保存')});
}
function openStockEditor(id,adjust=false){
 if(!cloud.docs.stock){show('请先执行耗材库存更新 SQL，再重新载入');return}
 const state=stockState(),revision=cloud.docs.stock.revision;
 const item=state.items.find(x=>x.id===id)||{id:stockUuid(),name:'',spec:'',unit:'个',current:0,target:0,note:'',section:'selectable',enabled:true};
 const mask=document.createElement('div');mask.className='consumable-mask stock-edit-mask';mask.style.display='flex';mask.setAttribute('role','dialog');mask.setAttribute('aria-modal','true');
 mask.innerHTML=`<div class="consumable-box stock-editor"><button type="button" class="info-close" aria-label="关闭">×</button><h3>${adjust?'入库 / 调整数量':id?'编辑物品':'添加物品'}</h3><form class="center-form">
 <label>物品名称<input name="name" maxlength="100" required value="${esc(item.name)}"></label>
 <label>规格<input name="spec" maxlength="100" value="${esc(item.spec)}" placeholder="例如 250 mL"></label>
 <label>所属板块<select name="section"><option value="selectable">登记可选物品</option><option value="private">仅管理员查看</option></select></label>
 <label>单位<input name="unit" maxlength="16" required value="${esc(item.unit)}" placeholder="个、包、卷"></label>
 <label>应保持数量<input name="target" type="number" min="0" max="9999999" step="1" required value="${item.target}"></label>
 <label>${adjust?'调整后当前数量':'当前数量'}<input name="current" type="number" min="0" max="9999999" step="1" required value="${item.current}"></label>
 <label>备注<textarea name="note" maxlength="1000" placeholder="存放位置、购买规格、补货要求等">${esc(item.note)}</textarea></label>
 <label><span><input name="enabled" type="checkbox" ${item.enabled?'checked':''}> 在登记选项中显示（仅登记可选板块生效）</span></label>
 <label>本次操作说明<input name="reason" maxlength="200" placeholder="例如采购入库、盘点调整"></label>
 <button class="primary" type="submit">保存</button></form><p class="stock-save-error" role="alert"></p></div>`;
 const form=mask.querySelector('form');form.elements.section.value=item.section;
 const close=()=>mask.remove();mask.querySelector('.info-close').onclick=close;mask.onclick=e=>{if(e.target===mask)close()};
 form.onsubmit=async e=>{e.preventDefault();const data=new FormData(form),next={...item,name:data.get('name').trim(),spec:data.get('spec').trim(),unit:data.get('unit').trim(),section:data.get('section'),current:Number(data.get('current')),target:Number(data.get('target')),note:data.get('note').trim(),enabled:data.has('enabled')};
  if(!next.name||!next.unit||![next.current,next.target].every(n=>Number.isSafeInteger(n)&&n>=0&&n<=9999999))return;
  const items=state.items.slice(),index=items.findIndex(x=>x.id===next.id);if(index<0)items.push(next);else items[index]=next;
  const b=form.querySelector('[type=submit]');b.disabled=true;
  if(await saveStockItems(items,data.get('reason').trim(),revision))close();else{b.disabled=false;mask.querySelector('.stock-save-error').textContent='保存失败。若库存已更新，请关闭后重新载入，再修改。'}
 };document.body.append(mask);
}
// All loss processing routes share the same backend reconciliation.
async function saveLoss(arr){return cloudOperation(async()=>{await cloudSaveDoc('loss',arr);await cloudRefresh(true)})}
function renderStockLoss(){
 if(!adminMode)return;
 const rows=loadLoss();$('adminList').innerHTML=rows.map(r=>`<div class="admin-loss-item"><div class="admin-loss-head"><b>${esc(r.item)} × ${esc(r.num)} ${esc(r.stockUnit||'')}</b><small>${esc(r.date)}</small></div><p>填写人：${esc(r.person)}${r.remark?'<br>备注：'+esc(r.remark):''}</p><p>${r.stockId?'已关联库存 · ':''}<span class="loss-status ${r.done?'done':'wait'}">${r.done?'已补充 / 处理完成':'待补充 / 待处理'}</span>${r.done&&r.replenishedDate?' · '+esc(r.replenishedDate):''}</p><div class="loss-admin-actions"><button data-loss-toggle="${esc(r.id)}">${r.done?'撤销处理':r.stockId?'已补充，补回库存':'处理完成'}</button><button data-loss-delete="${esc(r.id)}">删除错误记录</button></div></div>`).join('')||'<p class="center-empty">暂无登记记录</p>';
 $('adminList').querySelectorAll('[data-loss-toggle]').forEach(b=>b.onclick=async()=>{const arr=loadLoss(),r=arr.find(x=>x.id===b.dataset.lossToggle);if(!r)return;r.done=!r.done;r.replenishedDate=r.done?todayStr():'';if(await saveLoss(arr)){renderStockLoss();show(r.done?'已处理完成'+(r.stockId?'，库存已补回':''):'已撤销处理')}});
 $('adminList').querySelectorAll('[data-loss-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条登记？尚未补充的关联库存会恢复。'))return;const arr=loadLoss().filter(x=>x.id!==b.dataset.lossDelete);if(await saveLoss(arr)){renderStockLoss();show('记录已删除')}});
}
renderAdminLoss=renderStockLoss;openAdminLossPanel=renderStockLoss;
centerModules.stock=['耗材库存','adminStock'];
const selectCenterBeforeStock=selectCenter;
selectCenter=function(section){selectCenterBeforeStock(section);if(section==='stock'&&adminMode)renderStock()};
window.addEventListener('load',()=>{
 $('lossStockChoice').onchange=updateStockChoice;
 $('lossBtn').onclick=()=>{openLoss();renderStockChoices()};
 $('lossSubmit').onclick=submitStockLoss;
 $('adminStock').onclick=()=>cloudSelectSection('stock');
});

</script>
<script>
function renderInstrumentAdmin(){
  const host=$('adminList');
  const doc=cloud.docs.instruments;
  if(!doc){host.textContent='请先执行仪器管理更新 SQL，再重新载入。';return;}
  const entries=doc.data;
  const labels={active:'开放预约',paused:'已暂停',archived:'已归档'};
  host.innerHTML=`<div class="overview-row"><div><h3>仪器清单</h3><p>暂停会停止新预约。归档会从预约页移除仪器，已有预约可在预约记录中处理。</p></div><button type="button" id="addInstrument">＋ 添加仪器</button></div>
    <div id="instrumentEditor"></div>
    ${entries.map(item=>`<div class="record-item instrument-record"><div><b>${esc(item.name)}</b><span class="instrument-status" data-status="${esc(item.status)}">${labels[item.status]}</span>
      ${item.sub?'<p>'+esc(item.sub)+'</p>':''}${item.status==='paused'&&item.reason?'<p>'+esc(item.reason)+'</p>':''}</div>
      <div class="instrument-actions"><button type="button" data-instrument-edit="${esc(item.id)}">编辑</button>
      ${item.status==='active'?'<button type="button" data-instrument-status="paused" data-id="'+esc(item.id)+'">暂停</button>':
      '<button type="button" data-instrument-status="active" data-id="'+esc(item.id)+'">恢复预约</button>'}
      ${item.status==='archived'?'':'<button type="button" data-instrument-status="archived" data-id="'+esc(item.id)+'">移除</button>'}</div></div>`).join('')}`;
  async function save(items){
    return cloudOperation(async()=>{
      await cloudRpc('instruments_save',{items,revision:doc.revision});
      await cloudRefresh(true);
      cloud.dirty=false;
      renderAll();renderInstrumentAdmin();
      show('仪器清单已保存');
    });
  }
  function edit(item,status){
    const target=$('instrumentEditor');
    const nextStatus=status||item?.status||'active';
    target.innerHTML=`<form class="center-form instrument-editor">
      <label>仪器名称<input name="name" maxlength="60" required value="${esc(item?.name||'')}"></label>
      <label>用途或说明<input name="sub" maxlength="120" value="${esc(item?.sub||'')}"></label>
      ${nextStatus==='paused'?'<label>暂停原因（选填）<input name="reason" maxlength="120" value="'+esc(item?.reason||'')+'"></label>':''}
      <button type="submit" class="primary">${nextStatus==='paused'?'确认暂停':'保存仪器'}</button><button type="button" class="secondary">返回</button></form>`;
    const form=target.firstElementChild;
    form.querySelector('.secondary').onclick=()=>{target.replaceChildren();cloud.dirty=false;};
    form.onsubmit=async e=>{
      e.preventDefault();
      const data=new FormData(form), name=data.get('name').trim();
      if(!name){show('请填写仪器名称');return;}
      const next={id:item?.id||'inst_'+salaryRecordId(),name,sub:data.get('sub').trim(),
        icon:item?.icon||'◫',reason:data.get('reason')?.trim()||'',status:nextStatus};
      await save(item?entries.map(x=>x.id===item.id?next:x):[...entries,next]);
    };
    cloud.dirty=true;
    form.elements[nextStatus==='paused'?'reason':'name'].focus();
  }
  $('addInstrument').onclick=()=>edit();
  for(const button of host.querySelectorAll('[data-instrument-edit]')){
    button.onclick=()=>edit(entries.find(item=>item.id===button.dataset.instrumentEdit));
  }
  for(const button of host.querySelectorAll('[data-instrument-status]')){
    button.onclick=async()=>{
      const item=entries.find(x=>x.id===button.dataset.id), status=button.dataset.instrumentStatus;
      if(!item)return;
      if(status==='paused'){edit(item,status);return;}
      if(status==='archived'&&!confirm('将「'+item.name+'」从预约页移除？已有预约会保留，可在这里恢复仪器。'))return;
      await save(entries.map(x=>x.id===item.id?{...x,status,reason:''}:x));
    };
  }
}

</script>
