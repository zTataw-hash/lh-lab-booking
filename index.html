<body>
<div class="app" id="app">
<div class="top-tools">
  <button class="tool-btn" id="guideBtn"><span aria-hidden="true">📖</span><b>预约指南</b></button>
  <button class="tool-btn" id="noticeBtn"><span aria-hidden="true">📋</span><b>实验须知</b></button>
  <button class="tool-btn" id="lossBtn"><span aria-hidden="true">🧪</span><b>耗材损失</b></button>
<button class="tool-btn small" id="formulaBtn"><span aria-hidden="true">🧮</span><b>配方计算器</b></button>
</div>
<header class="top"><div class="brand">LH Lab-booking</div><div style="display:flex;gap:6px;align-items:center"><button class="admin-btn" id="adminBtn">管理员中心</button><span class="badge">预约码预览版</span></div></header>

<section id="formulaCenter" aria-label="配方计算器">
<div class="formula-heading"><h1>配方计算器</h1><button class="tool-btn" id="formulaBack">返回预约</button></div>
<iframe id="formulaFrame" title="zyC 配方计算器"></iframe>
</section>
<div style="padding:8px 14px;font-size:12px;display:flex;gap:8px;align-items:center" id="cloudBar"><span id="cloudStatus" role="status">正在连接云端…</span><button class="tool-btn" id="cloudRefresh" type="button">重新载入</button></div>

<div class="instruments" id="instruments"></div>
<section class="hero"><div class="ico" id="ico"></div><div><h2 id="iname"></h2><p id="idesc"></p></div><span class="ok">正常开放</span></section>


<section class="admin-panel" id="adminPanel" aria-label="管理员中心">
  <div class="center-head"><div><h1>管理员中心</h1><p>集中处理实验室预约、耗材、劳务与资金</p></div><div class="salary-tools"><button id="changeAdminCode" type="button">修改管理员码</button><button id="adminExit">返回预约</button></div></div>
  <div class="center-layout"><nav class="center-nav" aria-label="管理模块">
    <button id="adminHome">管理概览</button><button id="adminView">预约记录</button>
    <button id="adminLoss">耗材管理</button><button id="adminSalary">劳务管理</button><button id="adminFunds">实验资金</button><button id="adminInfo">指南与须知</button>
  </nav><div class="center-content"><h2 id="centerTitle">管理概览</h2><div class="center-actions"><button id="adminCancel" hidden>管理员取消</button><button id="exportLoss" hidden>导出耗材记录</button></div><div class="admin-list" id="adminList"></div></div></div>
</section>
<main class="main">
  <div class="toolbar">
    <div class="title">📅 仪器预约</div>
    <div class="controls">
      <div class="seg action" id="actionSeg">
        <button class="active" data-action="book">预约</button>
        <button class="cancelmode" data-action="cancel">取消预约</button>
      </div>
      <div class="seg" id="viewSeg">
        <button class="active" data-view="week">周历</button>
        <button data-view="month">月历</button>
      </div>
    </div>
  </div>
  <div class="note" id="gestureNote">点按可单选；手机上直接上下滑动可滚动页面；先横向滑动选择，再不松手向下滑可跨行连续选择。预约和取消都会绑定当前“姓名 + 登录码”身份。</div>

  <section id="week">
    <div class="toolbar" style="margin-bottom:10px"><div id="weekRange" aria-live="polite" style="font-size:13px;font-weight:700"></div><div class="controls"><button type="button" class="tool-btn" id="weekPrev">← 上一周</button><button type="button" class="tool-btn" id="weekToday">今天</button><button type="button" class="tool-btn" id="weekNext">下一周 →</button></div></div><div class="dates" id="dates"></div>
    <div class="dayhead"><b id="daytext"></b><div class="legend"><span><i class="ldot free"></i>可预约</span><span><i class="ldot busy"></i>已预约</span><span><i class="ldot sel"></i>已选择</span></div></div>
    <div class="slots" id="slots"></div>
  </section>

  <section class="month" id="month">
    <div class="monthbar"><button id="prev">‹</button><div class="monthlabel" id="mlabel"></div><button id="next">›</button></div>
    <div class="grid" id="grid"></div>
    <div class="dayhead"><b id="mdaytext"></b><span>点日期后在下方滑动选择时段</span></div>
    <div class="slots" id="mslots"></div>
  </section>
</main>
</div>

<div class="selectbar">
  <div class="selinfo"><b id="selcount">尚未选择时段</b><div id="selpreview">点按或按住滑动选择</div></div>
  <button class="clear" id="clear">清空</button>
  <button class="submit" id="submit" disabled>预约已选时段</button>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh"><h3 id="mtitle"></h3><button class="x" id="close">×</button></div>
    <div class="summary" id="summary"></div>
    <div id="bookingFields">
      <div class="f"><label>预约人</label><input id="booker" placeholder="例如：刘芃志"></div>
      <div class="f"><label>预约码（至少2位数字，取消预约时需要）</label><input id="bookingCode" type="text" inputmode="numeric" placeholder="例如：66"></div>
      <div class="f"><label>用途 / 样品（选填）</label><textarea id="purpose" placeholder="例如：电化学测试 / 粉体煅烧"></textarea></div>
    </div>
    <div id="cancelFields" style="display:none">
      <div class="f"><label id="cancelCodeLabel">请输入预约码</label><input id="cancelCode" type="text" inputmode="numeric" placeholder="输入预约码后才能取消"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="admin-mask" id="adminMask">
 <div class="admin-box">
  <h3>管理员验证</h3>
  <input id="adminInput" type="text" placeholder="请输入管理员码">
  <div style="text-align:right;margin-top:12px">
   <button class="admin-no" id="adminCancelInput">取消</button>
   <button class="admin-ok" id="adminConfirmInput">确认</button>
  </div>
 </div>
</div>

<div class="consumable-mask" id="lossMask">
<div class="consumable-box">
<h3>耗材损失登记 <button style="float:right;border:0;border-radius:50%" id="lossClose">×</button></h3>
<div class="f"><label>损坏物品</label><input id="lossItem" placeholder="例如：大烧杯、陶瓷管"></div>
<div class="f"><label>数量</label><input id="lossNum" inputmode="numeric" placeholder="例如：2"></div>
<div class="f"><label>损坏时间</label><input id="lossDate" type="date"></div>
<div class="f"><label>填写人</label><input id="lossPerson" placeholder="姓名"></div>
<div class="f"><label>备注</label><textarea id="lossRemark" placeholder="损坏原因等"></textarea></div>
<button class="primary" id="lossSubmit">提交</button>
</div></div>
<div class="info-mask" id="infoMask">
  <div class="info-box">
    <button class="info-close" id="infoClose">×</button>
    <h3 id="infoTitle"></h3>
    <div id="infoContent"></div>
  </div>
</div>

</div>


<script>
// Shared state only. Calculator iframe and its storage are intentionally untouched.
const cloud = {
  url:'https://ejtefmeobcdxckjmqavx.supabase.co', key:'sb_publishable_D5EQ1uKYNE8YhtlqDMbvBQ_bK4ngnaY',
  bookings:{}, docs:{}, token:'', ready:false, busy:false, dirty:false, section:'home', polling:false
};
function cloudStatus(message){const node=document.getElementById('cloudStatus');if(node)node.textContent=message}
async function cloudRpc(op,args={},token=cloud.token){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch(cloud.url+'/rest/v1/rpc/zyc_api',{method:'POST',headers:{apikey:cloud.key,'Content-Type':'application/json'},body:JSON.stringify({op,args,token}),signal:controller.signal});
    const data=await response.json();
    if(!response.ok)throw Error(data.code==='PGRST202'?'数据库尚未初始化，请先执行 supabase-init.sql':data.message||'云端请求失败');
    if(!data.ok){if(data.auth){cloud.token='';exitAdmin()}throw Error(data.error||'保存失败')}
    return data;
  }catch(e){if(e.name==='AbortError')throw Error('连接超时，请检查网络后重试');throw e}finally{clearTimeout(timer)}
}
function cloudDoc(key,fallback){return structuredClone(cloud.docs[key]?.data??fallback)}
async function cloudSaveDoc(key,data){
  const revision=cloud.docs[key]?.revision;
  if(revision===undefined)throw Error('请重新进入此模块，载入云端数据');
  const result=await cloudRpc('doc_save',{key,data,revision});
  cloud.docs[key]={data:structuredClone(data),revision:result.revision};cloud.dirty=false;
}
async function cloudRefresh(admin=false){
  const [result,privateData]=await Promise.all([cloudRpc('read',{},''),admin?cloudRpc('admin_read'):Promise.resolve(null)]);cloud.bookings=result.bookings;
  // Do not advance editable document revisions underneath unsaved forms.
  if(!cloud.token)cloud.docs.info=result.docs.info;
  if(privateData)cloud.docs=privateData.docs;
  cloud.ready=true;cloudStatus('已连接云端 · 数据每 5 秒同步');
}
async function cloudOperation(fn){
  if(cloud.busy)return false;
  cloud.busy=true;document.body.classList.add('cloud-saving');
  try{await fn();return true}catch(e){cloudStatus(e.message);show(e.message);return false}
  finally{cloud.busy=false;document.body.classList.remove('cloud-saving')}
}
async function cloudSaveHandled(key,data){return cloudOperation(()=>cloudSaveDoc(key,data))}
async function cloudEnterAdmin(){
  await cloudOperation(async()=>{
    const r=await cloudRpc('login',{code:$('adminInput').value.trim()},'');cloud.token=r.token;
    await cloudRefresh(true);$('adminInput').value='';adminMode=true;selected.clear();
    document.body.classList.add('center-open');$('adminMask').style.display='none';$('adminPanel').style.display='block';
    cloud.section='home';cloud.dirty=false;selectCenter('home');window.scrollTo(0,0);
  });
}
async function cloudSelectSection(section,forceRefresh=false){
  if(!cloud.token||!adminMode)return;
  if(cloud.busy){show('正在保存或载入，请稍候');return}
  if(cloud.dirty&&!confirm('有未保存的修改，确定放弃并切换吗？'))return;
  if(forceRefresh){
    await cloudOperation(async()=>{await cloudRefresh(true);cloud.dirty=false;cloud.section=section;selectCenter(section)});
    return;
  }
  // Login preloads all modules. Navigation never waits for another network trip.
  cloud.dirty=false;cloud.section=section;selectCenter(section);
}
async function cloudBook(){
  const who=$('booker').value.trim(),code=$('bookingCode').value.trim();
  if(!who||code.length<2){show('请填写姓名和至少2位预约码');return}
  const ids=[...selected.keys()];
  await cloudOperation(async()=>{
    await cloudRpc('book',{ids,booker:who,code,purpose:$('purpose').value.trim()});
    selected.clear();closeModal();
    try{await cloudRefresh()}catch{cloud.ready=false;cloudStatus('预约已保存，刷新暂时失败，请重新载入')}
    renderAll();show('预约已保存到云端');
  });
}
async function cloudCancel(){
  const code=$('cancelCode').value.trim();if(!code){show('请输入预约码');return}
  await cloudOperation(async()=>{await cloudRpc('cancel',{ids:[...selected.keys()],code});selected.clear();closeModal();await cloudRefresh();renderAll();show('预约已取消')});
}
async function cloudAdminCancel(group){
  if(!confirm('确认取消这条预约的全部时段？'))return;
  await cloudOperation(async()=>{await cloudRpc('admin_cancel',{ids:group.ids,groupId:group.groupId});await cloudRefresh();renderAll();showAdminList();show('预约已取消')});
}
async function cloudAddLoss(){
  const args={item:$('lossItem').value.trim(),person:$('lossPerson').value.trim(),num:$('lossNum').value.trim()||'1',date:$('lossDate').value||todayStr(),remark:$('lossRemark').value.trim()};
  await cloudOperation(async()=>{await cloudRpc('loss_add',args,'');$('lossMask').style.display='none';$('lossItem').value='';$('lossRemark').value='';show('耗材记录已提交到云端')});
}
function cloudInstall(){
  $('adminConfirmInput').onclick=cloudEnterAdmin;
  $('adminInput').onkeydown=e=>{if(e.key==='Enter')cloudEnterAdmin();if(e.key==='Escape')$('adminMask').style.display='none'};
  $('lossSubmit').onclick=cloudAddLoss;
  Object.entries(centerModules).forEach(([key,value])=>$(value[1]).onclick=()=>cloudSelectSection(key));
  $('cloudRefresh').onclick=async()=>{if(cloud.token)await cloudSelectSection(cloud.section,true);else await cloudOperation(async()=>{await cloudRefresh();renderAll()})};
  $('adminList').addEventListener('input',()=>cloud.dirty=true);
  cloudOperation(async()=>{await cloudRefresh();renderAll()});
  setInterval(async()=>{
    if(document.hidden||cloud.busy||cloud.polling)return;cloud.polling=true;
    try{
      await cloudRefresh();
      if(!drag.active&&drag.pointerId===null)renderAll();
      if(adminMode&&cloud.section==='bookings'&&!cloud.dirty)showAdminList();
      if(cloud.token){
        const fresh=await cloudRpc('admin_read');
        if(cloud.busy||Object.keys(fresh.docs).some(k=>fresh.docs[k].revision<(cloud.docs[k]?.revision??-1)))return;
        const changed=Object.keys(fresh.docs).some(k=>fresh.docs[k].revision>(cloud.docs[k]?.revision??-1));
        if(changed){
          if(cloud.dirty||document.querySelector('dialog[open]')||$('adminList').contains(document.activeElement))cloudStatus('其他设备已更新 · 请保存或放弃修改后点“重新载入”');
          else{cloud.docs=fresh.docs;selectCenter(cloud.section)}
        }
      }
    }catch(e){cloud.ready=false;cloudStatus('同步失败：'+e.message)}finally{cloud.polling=false}
  },5000);
}


const INST=[
  {id:'echem',name:'电化学工作站',icon:'⚡',sub:'电化学测试'},
  {id:'powder',name:'马弗炉（烧粉）',icon:'🔥',sub:'粉体煅烧'},
  {id:'piece',name:'马弗炉（烧片）',icon:'◫',sub:'片状样品烧结'}
];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function start(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return start(x)}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function wd(d){return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
function cn(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function bid(i,d,h){return `${i}|${key(d)}|${h}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){return structuredClone(cloud.bookings)}
function save(){throw Error('请通过云端预约操作保存')}
function parseSlotId(id){
  const [i,ds,hs]=id.split('|');
  const [y,m,d]=ds.split('-').map(Number);
  return {instrument:i,date:new Date(y,m-1,d),hour:Number(hs)};
}

let inst='echem';
let day=start(new Date());
let weekStart=start(new Date());
let monthCursor=new Date(day.getFullYear(),day.getMonth(),1);
let view='week';
let action='book';
let selected=new Map();

let currentIdentity = loadIdentity();

function loadIdentity(){
  try{
    const x=JSON.parse(localStorage.getItem('zyc_lab_identity_v1')||'null');
    if(x && x.name && x.code) return x;
  }catch(e){}
  return null;
}
function saveIdentity(name,code){
  currentIdentity={name:String(name).trim(),code:String(code).trim()};
  localStorage.setItem('zyc_lab_identity_v1',JSON.stringify(currentIdentity));
  updateIdentityUI();
}
function sameIdentity(booking){
  if(!currentIdentity || !booking) return false;
  return String(booking.ownerName||booking.booker||'').trim()===currentIdentity.name &&
         String(booking.ownerCode||'').trim()===currentIdentity.code;
}
function requireIdentity(){
  if(currentIdentity) return true;
  openIdentityModal();
  show('请先设置姓名和登录码');
  return false;
}
function updateIdentityUI(){
  const t=$('userChipText');
  if(t) t.innerHTML=currentIdentity?`当前：<b>${esc(currentIdentity.name)}</b>`:'设置身份';
  const o=$('modalOwnerName');
  if(o) o.textContent=currentIdentity?currentIdentity.name:'未设置';
}
function openIdentityModal(){
  $('identityName').value=currentIdentity?.name||'';
  $('identityCode').value=currentIdentity?.code||'';
  $('identityMask').style.display='flex';
  setTimeout(()=>$('identityName').focus(),50);
}
function closeIdentityModal(){$('identityMask').style.display='none'}
function commitIdentity(){
  const name=$('identityName').value.trim();
  const code=$('identityCode').value.trim();
  if(!name){alert('请填写姓名');return}
  if(!code){alert('请填写登录码');return}
  saveIdentity(name,code);
  closeIdentityModal();
  selected.clear();
  renderAll();
  show(`当前身份：${name}`);
}


let drag={
  active:false,
  pointerId:null,
  intent:'add',
  timer:null,
  moved:false,
  lastId:null,
  startX:0,
  startY:0,
  touchLike:false
};

function busyHours(d){
  const b=load();let n=0;
  for(let h=0;h<24;h++) if(b[bid(inst,d,h)]) n++;
  return n;
}
function availableHours(d){return 24-busyHours(d)}
function progressClass(av){return av<=5?'low':(av<=11?'mid':'')}
function progressPct(av){return Math.max(0,Math.min(100,av/24*100))}

function renderInst(){
  $('instruments').innerHTML=INST.map(x=>`<button class="inst ${x.id===inst?'active':''}" data-id="${x.id}"><b>${x.name}</b><small>${x.sub}</small></button>`).join('');
  $('instruments').querySelectorAll('.inst').forEach(b=>b.onclick=()=>{
    if(b.dataset.id!==inst){
      selected.clear();
      inst=b.dataset.id;
      renderAll();
    }
  });
  const x=INST.find(x=>x.id===inst);
  $('ico').textContent=x.icon;
  $('iname').textContent=x.name;
  $('idesc').textContent=`独立预约日历 · ${x.sub} · 每 1 小时为一个时段`;
}

function renderDates(){
  const box=$('dates');box.innerHTML='';
  $('weekRange').textContent=`${key(weekStart)} 至 ${key(add(weekStart,6))}`;
  for(let i=0;i<7;i++){
    const d=add(weekStart,i),av=availableHours(d),el=document.createElement('button');
    el.className='date'+(key(d)===key(day)?' active':'');
    el.innerHTML=`
      <div class="topline"><span class="wk">${wd(d)}</span><span class="dm">${pad(d.getMonth()+1)}/${pad(d.getDate())}</span></div>
      <div class="avail">可预约 ${av} / 24 h</div>
      <div class="progress"><i class="${progressClass(av)}" style="width:${progressPct(av)}%"></i></div>`;
    el.onclick=()=>{day=d;renderDates();renderSlots('slots',d)};
    box.appendChild(el);
  }
  $('daytext').textContent=`${cn(day)} · ${wd(day)} · 剩余可预约 ${availableHours(day)} 小时`;
}

function isEligible(slotId){
  const b=load(),exists=!!b[slotId];
  return action==='book' ? !exists : exists;
}
function isSelected(slotId){return selected.has(slotId)}

function slotDisplay(d,h,bk,sel){
  if(action==='book'){
    if(bk) return {state:'已预约',who:`${esc(bk.booker||'未填写')} · ${esc(bk.purpose||'未备注')}`};
    return {state:sel?'已选择':'可预约',who:''};
  }
  if(bk) return {
    state:sel?'已选取消':'已预约',
    who:`${esc(bk.booker||'未填写')}${bk.purpose?` · ${esc(bk.purpose)}`:''}`
  };
  return {state:'空闲',who:''};
}

function renderSlots(target,d){
  const box=$(target),b=load();box.innerHTML='';
  for(let h=0;h<24;h++){
    const id=bid(inst,d,h),bk=b[id],sel=isSelected(id),info=slotDisplay(d,h,bk,sel);
    const el=document.createElement('button');
    el.type='button';
    el.dataset.slotId=id;
    el.className='slot'+(bk?' busy':'')+(sel?(action==='book'?' selected-book':' selected-cancel'):'')+(!isEligible(id)?' disabled':'');
    el.innerHTML=`<div class="time">${pad(h)}:00 ~ ${pad((h+1)%24)}:00</div><div class="state">${info.state}</div>${info.who?`<div class="who">${info.who}</div>`:''}`;
    attachSlotPointer(el);
    box.appendChild(el);
  }
}

function renderMonth(){
  const y=monthCursor.getFullYear(),m=monthCursor.getMonth();
  $('mlabel').textContent=`${y}年 ${m+1}月`;
  const box=$('grid');
  box.innerHTML=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">周${x}</div>`).join('');
  const first=new Date(y,m,1),last=new Date(y,m+1,0).getDate();
  for(let i=0;i<first.getDay();i++) box.insertAdjacentHTML('beforeend','<div class="cell blank"></div>');
  for(let n=1;n<=last;n++){
    const d=new Date(y,m,n),av=availableHours(d),el=document.createElement('button');
    el.type='button';
    el.className='cell'+(key(d)===key(day)?' sel':'');
    el.innerHTML=`<div class="n">${n}</div><div class="h">${av}h 可约</div><div class="mp"><i class="${progressClass(av)}" style="width:${progressPct(av)}%"></i></div>`;

}

function beginDragSelection(el,e,immediate){
  const id=el.dataset.slotId;
  if(!id || !isEligible(id)) return;
  drag.pointerId=e.pointerId;
  drag.startX=e.clientX;drag.startY=e.clientY;
  drag.moved=false;drag.lastId=null;
  drag.touchLike=e.pointerType==='touch'||e.pointerType==='pen';
  drag.intent=selected.has(id)?'remove':'add';

  const activate=()=>{
    drag.active=true;
    document.body.classList.add('dragging');
    applyDragAt(el);
  };
  if(immediate) activate();
  else drag.timer=setTimeout(activate,190);
}


function fillRowByHour(hour, force){
  const row=Math.floor(hour/3);
  for(let h=row*3;h<row*3+3 && h<24;h++){
    const id=bid(inst,day,h);
    if(isEligible(id)) toggleSlotId(id,force);
  }
}

function applyDragAt(el){
  if(!el || !el.dataset || !el.dataset.slotId) return;
  const id=el.dataset.slotId;
  if(id===drag.lastId || !isEligible(id)) return;

  // 从一排最右侧滑到下一排时，自动选中下一整排，类似手机照片选择
  if(drag.lastId){
    const prev=parseSlotId(drag.lastId);
    const cur=parseSlotId(id);
    if(prev.date.getTime()===cur.date.getTime() && prev.hour%3===2 && cur.hour===prev.hour+3){
      fillRowByHour(cur.hour, drag.intent==='add');
      drag.lastId=id;
      rerenderVisibleSlots();
      return;
    }
  }

  drag.lastId=id;
  toggleSlotId(id,drag.intent==='add');
  rerenderVisibleSlots();
}

function attachSlotPointer(el){
  el.addEventListener('touchmove',handleSlotTouchMove,{passive:false});
  el.addEventListener('touchend',finishSlotTouch);
  el.addEventListener('touchcancel',finishSlotTouch);
  el.addEventListener('pointerdown',e=>{
    const id=el.dataset.slotId;
    if(!id || !isEligible(id)) return;

    if(e.pointerType==='mouse'){
      e.preventDefault();
      beginDragSelection(el,e,true);
    }else{
      // Delay selection until horizontal intent is established; vertical swipes scroll.
      drag.pointerId=e.pointerId;drag.startX=e.clientX;drag.startY=e.clientY;
      drag.active=false;drag.moved=false;drag.lastId=null;drag.touchLike=true;
      drag.startSlot=el;drag.intent=selected.has(id)?'remove':'add';
    }
  });
}

// A non-passive touch listener reserves scrolling only after a horizontal swipe.
function handleSlotTouchMove(e){
  if(!drag.touchLike||drag.pointerId===null||e.touches.length!==1)return;
  const touch=e.touches[0];
  const dx=touch.clientX-drag.startX,dy=touch.clientY-drag.startY;
  if(!drag.active){
    if(Math.max(Math.abs(dx),Math.abs(dy))<8)return;
    drag.moved=true;
    if(Math.abs(dy)>=Math.abs(dx)){
      drag.pointerId=null;drag.startSlot=null;return;
    }
    if(!e.cancelable){drag.pointerId=null;return}
    e.preventDefault();
    drag.active=true;document.body.classList.add('dragging');
    applyDragAt(drag.startSlot);
  }
  if(e.cancelable)e.preventDefault();
  const hit=document.elementFromPoint(touch.clientX,touch.clientY);
  const slot=hit&&hit.closest?hit.closest('.slot[data-slot-id]'):null;
  if(slot)applyDragAt(slot);
}
function finishSlotTouch(e){if(drag.active){drag.active=false;drag.pointerId=null;drag.lastId=null;document.body.classList.remove('dragging')}}
document.addEventListener('pointermove',e=>{
  if(drag.pointerId!==e.pointerId) return;
  const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
  if(Math.hypot(dx,dy)>7) drag.moved=true;

  if(!drag.active){
    if(drag.touchLike && drag.moved && drag.timer){
      clearTimeout(drag.timer);drag.timer=null;
    }
    return;
  }
  e.preventDefault();
  const hit=document.elementFromPoint(e.clientX,e.clientY);
  const slot=hit && hit.closest ? hit.closest('.slot[data-slot-id]') : null;
  if(slot) applyDragAt(slot);
},{passive:false});

function finishPointer(e){
  if(drag.pointerId!==e.pointerId) return;
  if(drag.timer){clearTimeout(drag.timer);drag.timer=null}
  const wasActive=drag.active;
  const moved=drag.moved;
  const x=e.clientX,y=e.clientY;
  drag.active=false;drag.pointerId=null;drag.lastId=null;
  document.body.classList.remove('dragging');

  if(e.type!=='pointercancel' && !wasActive && !moved){
    const hit=document.elementFromPoint(x,y);
    const slot=hit && hit.closest ? hit.closest('.slot[data-slot-id]') : null;
    if(slot && isEligible(slot.dataset.slotId)){
      toggleSlotId(slot.dataset.slotId);
      rerenderVisibleSlots();
    }
  }
}
document.addEventListener('pointerup',finishPointer);
document.addEventListener('pointercancel',finishPointer);

function formatSlotRange(arr){
  arr.sort((a,b)=>a.date-b.date||a.hour-b.hour);
  let res=[];
  let s=arr[0],e=arr[0];
  for(let i=1;i<arr.length;i++){
    let c=arr[i];
    if(c.date.toDateString()==e.date.toDateString() && c.hour==e.hour+1){
      e=c;
    }else{
      res.push(`${cn(s.date)} ${pad(s.hour)}:00-${pad(e.hour+1)}:00`);
      s=e=c;
    }
  }
  res.push(`${cn(s.date)} ${pad(s.hour)}:00-${pad(e.hour+1)}:00`);
  return res.join('；');
}

      r.done?'已补充':'待补充',
      r.replenishedDate||''
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
    csv+=row+'\n';
  });

  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='耗材损失记录.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  show('已导出耗材记录');
}

async function cleanLossRecords(){

function openAdminLossPanel(){
  if(typeof adminMode!=="undefined" && !adminMode){
    show("请先进入管理员模式");
    return;
  }

  const list=document.getElementById("adminList");
  if(!list) return;

  const records=typeof loadLoss==="function"?loadLoss():[];

  if(records.length===0){
    list.innerHTML="暂无耗材损失记录";
    return;
  }

  list.innerHTML=records.map(r=>`
    <div class="record-item" style="margin-bottom:10px">
      <b>${r.item||""} × ${r.num||1}</b><br>
      日期：${r.date||""}<br>
      填写人：${r.person||""}<br>
      ${r.remark?`备注：${r.remark}<br>`:""}

      <button onclick="adminToggleLoss('${r.id}')">
        ${r.done?"恢复待补充":"标记已补充"}
      </button>
      <button onclick="adminDeleteLoss('${r.id}')">
        删除
      </button>
    </div>
  `).join("");
}

window.addEventListener("load",()=>{
  const btn=document.getElementById("adminLoss");
  if(btn){
    btn.onclick=openAdminLossPanel;
  }
});

async function adminToggleLoss(id){
  const arr=loadLoss();
  const r=arr.find(x=>String(x.id)===String(id));
  if(!r){
    show("记录不存在");
    return;
  }
  r.done=!r.done;
  r.replenishedDate=r.done?new Date().toISOString().slice(0,10):"";
  if(!await saveLoss(arr))return;
  openAdminLossPanel();
  show(r.done?"已标记补充":"已恢复待补充");
}

async function adminDeleteLoss(id){
  let arr=loadLoss();
  const before=arr.length;
  arr=arr.filter(x=>String(x.id)!==String(id));
  if(!await saveLoss(arr))return;
  openAdminLossPanel();
  show(arr.length<before?"已删除":"记录不存在");
}

function addSalaryDemo(){

function formatBookingCreatedAt(value){
  if(value===undefined||value===null||value==='')return '未记录';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '未记录';
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}
const centerModules={home:['管理概览','adminHome'],bookings:['预约记录','adminView'],loss:['耗材管理','adminLoss'],salary:['劳务管理','adminSalary'],funds:['实验资金','adminFunds'],info:['指南与须知','adminInfo']};
function selectCenter(section){
  if(!adminMode)return;
  Object.entries(centerModules).forEach(([k,v])=>{$(v[1]).classList.toggle('active',k===section);$(v[1]).setAttribute('aria-current',k===section?'page':'false')});

}

const SALARY_PEOPLE_KEY='zyc_salary_people_v1',SALARY_CLAIMS_KEY='zyc_salary_claims_v1';
function readSalaryArray(key){try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function salaryMoney(value){return Math.round((Number(value)||0)*100)}
function salaryDisplay(cents){return (cents/100).toFixed(2)}
function salaryPeople(){return salaryState().people}
function salaryClaims(){return salaryState().claims}
async function persistSalary(key,value){return cloudSaveHandled('salary',value)}
const SALARY_STATE_KEY='zyc_salary_state_v2';
function salaryState(){return cloudDoc('salary',{people:[],claims:[],logs:[]})}
function salaryChange(before,after){return {personId:after.id,name:after.name,before:before?{...before}:null,after:{...after}}}
function recordSalaryChange(state,kind,changes,month){
  if(changes.length)state.logs.push({id:crypto.randomUUID(),at:new Date().toISOString(),kind,month:month||'',changes});
}
function renderSalaryLogs(){
  const target=$('salaryChangeHistory');if(!target)return;
  target.innerHTML=salaryState().logs.slice().reverse().map(log=>`<details><summary>${esc(formatBookingCreatedAt(log.at))} · ${esc(log.kind)} ${esc(log.month)}</summary>${log.changes.map(c=>`<div class="record-item"><b>${esc(c.name)}</b>${c.before&&c.before.name!==c.after.name?`（原姓名：${esc(c.before.name)}）`:''}<br>理论发放：${c.before?salaryDisplay(c.before.theory):'0.00'} → ${salaryDisplay(c.after.theory)} 元<br>已发放：${c.before?salaryDisplay(c.before.paid):'0.00'} → ${salaryDisplay(c.after.paid)} 元<br>剩余：${salaryDisplay(c.after.theory-c.after.paid)} 元</div>`).join('')}</details>`).join('')||'<p class="salary-note">暂无修改记录。后续保存的人员调整和申报发放会记录在这里。</p>';
}
function openSalary(){
  if(!adminMode)return;
  const people=salaryPeople();
  $('adminList').innerHTML=`<p class="salary-note">先添加人员，再设置发放金额。剩余金额 = 理论发放金额 − 已发放金额。金额单位：元。</p><form id="salaryPeopleForm"><div class="salary-table-wrap"><table class="salary-table"><thead><tr><th>姓名（必填）</th><th>理论发放金额</th><th>已发放金额</th><th>剩余金额</th></tr></thead><tbody id="salaryPeopleRows"></tbody></table></div><p id="salaryEmpty" class="salary-note" ${people.length?'hidden':''}>暂无人员，点击“添加人员”新增一行。</p><div class="salary-tools"><button type="button" id="salaryAddPerson">添加人员</button><button class="primary" type="submit">保存人员及金额</button><button type="button" id="salaryNewClaim">新增申报记录</button></div><div id="salarySaveStatus" role="status" class="salary-note"></div></form><div class="salary-history"><h3>月度申报记录</h3><div id="salaryClaimHistory"></div></div><div class="salary-history"><h3>修改记录</h3><div id="salaryChangeHistory"></div></div><div id="salaryLegacy"></div>`;
  people.forEach(appendSalaryPerson);
  $('salaryAddPerson').onclick=()=>{appendSalaryPerson({id:crypto.randomUUID(),name:'',theory:0,paid:0});$('salaryEmpty').hidden=true;$('salarySaveStatus').textContent='有未保存的修改，请点击保存。';$('salaryPeopleRows').lastElementChild.querySelector('input').focus()};
  $('salaryPeopleForm').onsubmit=async e=>{e.preventDefault();await saveSalaryPeopleForm()};
  $('salaryNewClaim').onclick=async()=>{if(await saveSalaryPeopleForm())openSalaryClaim()};
  renderSalaryClaims();renderSalaryLogs();
  const legacy=loadSalary();
  if(legacy.length){const box=document.createElement('details');box.innerHTML='<summary>旧版劳务记录（保留查看）</summary>';legacy.forEach(r=>{const row=document.createElement('p');row.textContent=`${r.name||'未填写'} · 本月申报 ${r.monthAmount||0} 元 · 累计已发 ${r.paid||0} 元`;box.append(row)});$('salaryLegacy').append(box)}
}
function appendSalaryPerson(person){
  const row=document.createElement('tr');row.dataset.id=person.id;
  row.innerHTML=`<td><input aria-label="姓名" data-field="name" required maxlength="60" placeholder="请输入姓名" value="${esc(person.name)}"></td><td><input aria-label="理论发放金额" data-field="theory" type="number" min="0" max="999999999" step="0.01" value="${salaryDisplay(person.theory)}"></td><td><input aria-label="已发放金额" data-field="paid" type="number" min="0" max="999999999" step="0.01" value="${salaryDisplay(person.paid)}"></td><td><output>${salaryDisplay(person.theory-person.paid)}</output></td>`;
  row.oninput=()=>{row.querySelector('output').textContent=salaryDisplay(salaryMoney(row.querySelector('[data-field=theory]').value)-salaryMoney(row.querySelector('[data-field=paid]').value));$('salarySaveStatus').textContent='有未保存的修改，请点击保存。'};
  $('salaryPeopleRows').append(row);
}
async function saveSalaryPeopleForm(){
  if(!adminMode||!$('salaryPeopleForm').reportValidity())return false;
  const people=[];
  for(const row of $('salaryPeopleRows').children){const name=row.querySelector('[data-field=name]');if(!name.value.trim()){name.setCustomValidity('请填写姓名');name.reportValidity();name.oninput=()=>name.setCustomValidity('');return false}people.push({id:row.dataset.id,name:name.value.trim(),theory:salaryMoney(row.querySelector('[data-field=theory]').value),paid:salaryMoney(row.querySelector('[data-field=paid]').value)})}
  const state=salaryState();
  const changes=people.map(p=>salaryChange(state.people.find(old=>old.id===p.id),p)).filter(c=>!c.before||c.before.name!==c.after.name||c.before.theory!==c.after.theory||c.before.paid!==c.after.paid);
  state.people=people;recordSalaryChange(state,'人员及金额修改',changes);
  if(!await persistSalary(SALARY_STATE_KEY,state))return false;
  renderSalaryLogs();
  $('salarySaveStatus').textContent='人员及金额已保存';return true;
}
function openSalaryClaim(){
  const people=salaryPeople();if(!people.length){show('请先添加人员');return}
  let dialog=$('salaryClaimDialog');if(dialog)dialog.remove();dialog=document.createElement('dialog');dialog.id='salaryClaimDialog';dialog.className='salary-dialog';
  const now=new Date(),month=now.getFullYear()+'-'+pad(now.getMonth()+1);
  dialog.innerHTML=`<form id="salaryClaimForm"><h2>新增申报记录</h2><label>申报月份 <input class="salary-month" id="salaryClaimMonth" type="month" value="${month}" required></label><p class="salary-note">每月保存一份申报。保存后，申报金额自动累加到每个人的已发放金额，并更新剩余金额。</p><div id="salaryClaimRows"></div><div class="salary-total" id="salaryClaimTotal">合计：0.00 元</div><div class="salary-error" id="salaryClaimError" role="alert"></div><div class="salary-tools"><button type="button" id="salaryClaimClose">取消</button><button class="primary" type="submit">保存申报</button></div></form>`;
  document.body.append(dialog);
  people.forEach(person=>{const label=document.createElement('label');label.className='salary-person-amount';label.innerHTML=`<span>${esc(person.name)}</span><input type="number" aria-label="${esc(person.name)}申报金额" min="0" max="999999999" step="0.01" value="0.00" required>`;label.dataset.id=person.id;$('salaryClaimRows').append(label)});
  const loadMonth=()=>{const claim=salaryClaims().find(c=>c.month===$('salaryClaimMonth').value);$('salaryClaimError').textContent=claim?'该月份已有申报记录，请选择其他月份。':''};
  $('salaryClaimMonth').onchange=loadMonth;loadMonth();
  $('salaryClaimRows').oninput=()=>{$('salaryClaimTotal').textContent='合计：'+salaryDisplay([...$('salaryClaimRows').querySelectorAll('input')].reduce((sum,input)=>sum+salaryMoney(input.value),0))+' 元'};
  $('salaryClaimClose').onclick=()=>dialog.close();
  $('salaryClaimForm').onsubmit=async e=>{e.preventDefault();if(!adminMode)return;const month=$('salaryClaimMonth').value,claims=salaryClaims();if(!/^\d{4}-\d{2}$/.test(month))return;if(claims.some(c=>c.month===month)){$('salaryClaimError').textContent='该月份已有申报记录，请勿重复申报。';return}const entries=[...$('salaryClaimRows').children].map(row=>({personId:row.dataset.id,name:people.find(p=>p.id===row.dataset.id).name,amount:salaryMoney(row.querySelector('input').value)}));const state=salaryState();
if(state.claims.some(c=>c.month===month))return;
if(entries.some(entry=>!state.people.some(p=>p.id===entry.personId))){$('salaryClaimError').textContent='人员已变更，请关闭后重新申报。';return}
const changes=[];
entries.forEach(entry=>{const person=state.people.find(p=>p.id===entry.personId),before={...person};person.paid+=entry.amount;changes.push(salaryChange(before,person))});
state.claims.push({id:crypto.randomUUID(),month,entries,createdAt:new Date().toISOString(),appliedToPaid:true});
recordSalaryChange(state,'月度申报计入已发放',changes,month);
if(!await persistSalary(SALARY_STATE_KEY,state))return;dialog.close();openSalary();show('申报已保存，已发放金额已更新')};
  dialog.showModal();
}
function renderSalaryClaims(){
  const claims=salaryClaims().slice().sort((a,b)=>b.month.localeCompare(a.month));
  $('salaryClaimHistory').innerHTML=claims.map(c=>`<details><summary><b>${esc(c.month)}</b> · ${c.appliedToPaid?'已计入已发放':'旧版记录，未自动计入'} · ${c.entries.length} 人 · 合计 ${salaryDisplay(c.entries.reduce((n,e)=>n+e.amount,0))} 元</summary>${c.entries.map(e=>`<div class="overview-row"><span>${esc(e.name)}</span><span>${salaryDisplay(e.amount)} 元</span></div>`).join('')}<button type="button" class="danger" data-delete-claim="${esc(c.id)}">删除申报记录</button></details>`).join('')||'<p class="salary-note">暂无申报记录。</p>';
  $('salaryClaimHistory').querySelectorAll('[data-delete-claim]').forEach(button=>button.onclick=()=>deleteSalaryClaim(button.dataset.deleteClaim));
}

async function deleteSalaryClaim(id){
  if(!adminMode)return;
  if($('salarySaveStatus').textContent.includes('未保存')){show('请先保存人员及金额的修改，再删除申报');return}
  let state=salaryState(),claim=state.claims.find(c=>c.id===id);
  if(!claim){show('该申报记录已不存在');return}
  if(!confirm(`确认删除 ${claim.month} 的申报记录？${claim.appliedToPaid?'将从对应人员的已发放金额中扣回本次申报金额。':'这是一条旧版记录，不会调整已发放金额。'}删除后可重新申报该月份。`))return;
  state=salaryState();claim=state.claims.find(c=>c.id===id);
  if(!claim)return;
  const deductions=new Map();
  if(claim.appliedToPaid)claim.entries.forEach(e=>deductions.set(e.personId,(deductions.get(e.personId)||0)+e.amount));
  for(const [personId,amount] of deductions){
    const person=state.people.find(p=>p.id===personId);
    if(!person||person.paid<amount){show('无法扣回：人员不存在或已发放金额不足，请先核对人员金额');return}
  }
  const changes=[];
  for(const [personId,amount] of deductions){const person=state.people.find(p=>p.id===personId),before={...person};person.paid-=amount;changes.push(salaryChange(before,person))}
  state.claims=state.claims.filter(c=>c.id!==id);
  state.logs.push({id:crypto.randomUUID(),at:new Date().toISOString(),kind:claim.appliedToPaid?'删除申报并扣回已发放':'删除旧版申报（未调整金额）',month:claim.month,changes,deletedClaim:claim});
  if(!await persistSalary(SALARY_STATE_KEY,state))return;
  openSalary();show('申报记录已删除，可重新申报该月份');
}

function getAdminCode(){return null}
function openChangeAdminCode(){
  if(!adminMode)return;
  let dialog=$('adminCodeDialog');if(dialog)dialog.remove();
  dialog=document.createElement('dialog');dialog.id='adminCodeDialog';dialog.className='salary-dialog';
  dialog.innerHTML=`<form id="adminCodeForm" class="center-form"><h2>修改管理员码</h2><label>当前管理员码<input id="oldAdminCode" type="password" autocomplete="current-password" required></label><label>新管理员码<input id="newAdminCode" type="password" autocomplete="new-password" minlength="4" maxlength="64" required></label><label>确认新管理员码<input id="confirmAdminCode" type="password" autocomplete="new-password" minlength="4" maxlength="64" required></label><p class="salary-note">新码为 4–64 位字符，不能包含空格。修改后，下次进入管理员中心使用新码。</p><div id="adminCodeError" class="salary-error" role="alert"></div><div class="salary-tools"><button type="button" id="cancelAdminCode">取消</button><button type="submit" class="primary">保存新码</button></div></form>`;
  document.body.append(dialog);
  $('cancelAdminCode').onclick=()=>dialog.close();
  dialog.addEventListener('close',()=>dialog.remove());
  $('adminCodeForm').onsubmit=async e=>{
    e.preventDefault();if(!adminMode)return;
    const old=$('oldAdminCode').value.trim(),next=$('newAdminCode').value,confirmCode=$('confirmAdminCode').value;
    const error=$('adminCodeError');
    if(next.length<4||next.length>64||/\s/.test(next)){error.textContent='新码须为 4–64 位字符，不能包含空格';return}
    if(next!==confirmCode){error.textContent='两次输入的新码不一致';return}
    if(next===old){error.textContent='新码不能与当前码相同';return}
    try{await cloudRpc('change_code',{old,next})}catch{error.textContent='保存失败，请检查浏览器存储空间后重试';return}
    dialog.close();exitAdmin();show('管理员码已修改，请使用新码重新进入');
  };
  dialog.showModal();
}
$('changeAdminCode').onclick=openChangeAdminCode;

const INFO_STORE_KEY='zyc_lab_information_v1';
function savedLabInfo(){return cloudDoc('info',{})}
function defaultInfoPlain(kind){
  const container=document.createElement('div');container.innerHTML=kind==='guide'?guideText:noticeText;
  container.querySelectorAll('ol').forEach(list=>{[...list.children].forEach((item,index)=>item.prepend(`${index+1}. `))});
  container.querySelectorAll('li,p').forEach(node=>node.append(document.createTextNode('\n')));
  return container.textContent.split('\n').map(line=>line.trim()).filter(Boolean).join('\n\n');
}
function labInfoHtml(kind){
  const saved=savedLabInfo();
  return typeof saved[kind]==='string'?`<div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(saved[kind])}</div>`:(kind==='guide'?guideText:noticeText);
}
function renderInfoEditor(){
  if(!adminMode)return;
  const saved=savedLabInfo();
  $('adminList').innerHTML=`<p class="salary-note">分别编辑首页“预约指南”和“实验须知”的内容。支持换行，保存后立即生效。</p><form id="labInfoForm" class="center-form"><label for="editGuide">预约指南</label><textarea id="editGuide" rows="10" required maxlength="20000" style="width:100%;padding:12px;border:1px solid var(--l);border-radius:8px;resize:vertical;font:inherit"></textarea><label for="editNotice">实验须知</label><textarea id="editNotice" rows="14" required maxlength="20000" style="width:100%;padding:12px;border:1px solid var(--l);border-radius:8px;resize:vertical;font:inherit"></textarea><div class="salary-tools"><button type="submit" class="primary">保存指南与须知</button></div><div id="labInfoStatus" class="salary-note" role="status"></div></form>`;
  $('editGuide').value=typeof saved.guide==='string'?saved.guide:defaultInfoPlain('guide');
  $('editNotice').value=typeof saved.notice==='string'?saved.notice:defaultInfoPlain('notice');
  $('labInfoForm').oninput=()=>{$('labInfoStatus').textContent='有未保存的修改。'};
  $('labInfoForm').onsubmit=async e=>{
    e.preventDefault();if(!adminMode)return;
    const guide=$('editGuide').value.trim(),notice=$('editNotice').value.trim();
    if(!guide||!notice){$('labInfoStatus').textContent='预约指南和实验须知都不能为空';return}
    try{if(!await cloudSaveHandled('info',{guide,notice,updatedAt:new Date().toISOString()}))return}catch{$('labInfoStatus').textContent='保存失败，请检查浏览器存储空间后重试';return}
    $('labInfoStatus').textContent='已保存，首页显示内容已更新。';show('指南与须知已更新');
  };
}
$('guideBtn').onclick=()=>openInfo('预约指南',labInfoHtml('guide'));
$('noticeBtn').onclick=()=>openInfo('实验须知',labInfoHtml('notice'));
